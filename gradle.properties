# Gradle JVM 参数 - 分配 2GB 内存给 Gradle 守护进程
org.gradle.jvmargs=-Xmx2G

# ============================================
# Fabric 生态版本配置（参考 fabricmc.net/develop/）
# ============================================

# Minecraft 版本
minecraft_version=1.20.1

# Yarn 映射版本（用于反混淆 Minecraft 代码）
# build.10 是 1.20.1 广泛使用的稳定版本
yarn_mappings=1.20.1+build.10

# Fabric Loader 版本（模组加载器）
loader_version=0.15.11

# Fabric Loom 版本（Gradle 插件版本）
# 注意：Fabric Maven 仓库没有 1.2 稳定版，使用 1.1.14（1.1.x 最新稳定版）
loom_version=1.1.14

# Fabric API 版本（Fabric 提供的 API，模组常需要）
# +1.20.1 后缀表示适配 1.20.1
fabric_version=0.92.1+1.20.1

# ============================================
# Mod 自身属性
# ============================================

# Maven 组 ID（Java 包名前缀）
maven_group=com.oreveins

# Mod 版本号
mod_version=2.0.0

# 构建产物的基础名称
archives_base_name=oreveins
